  <script data-research-projects-injector>
    (() => {
      const sectionMarkup = `
        <div class="rp-shell">
          <div class="mb-16">
            <p class="font-mono text-primary text-sm tracking-[0.2em] uppercase mb-3">// research & projects</p>
            <h2 class="font-display text-4xl md:text-5xl font-bold gradient-text inline-block">What I'm Building</h2>
            <p class="rp-intro">Research and engineering work across cybersecurity, trustworthy AI, knowledge graphs, computer vision, and full-stack software systems.</p>
          </div>

          <div class="rp-stack">
            <article class="rp-card">
              <div class="rp-top">
                <div class="rp-title-row">
                  <div class="rp-icon">⌘</div>
                  <div><div class="rp-status">PURC/URFS Research · Ongoing</div><h3 class="rp-name">ThreatRAGraph</h3></div>
                </div>
                <div class="rp-links">
                  <a class="rp-link" href="https://github.com/FardinSamin/ThreatRAGraph" target="_blank" rel="noreferrer">GitHub ↗</a>
                  <a class="rp-link" href="https://bravemailuncp-my.sharepoint.com/:w:/g/personal/fes006_bravemail_uncp_edu/IQCm7_P8xHQUS771Cvm0bU4iAR1KcH38iBG8epTPPhgONcc?e=n2FFPs" target="_blank" rel="noreferrer" title="UNCP access may be required">PURC/URFS Proposal ↗</a>
                </div>
              </div>
              <p class="rp-summary">A GraphRAG-based cyber threat intelligence research system investigating whether graph-structural similarity to historically documented threats can help produce useful provisional profiles when an emerging threat has only one or two early public reports.</p>
              <div class="rp-tags"><span class="rp-tag">Python</span><span class="rp-tag">GraphRAG</span><span class="rp-tag">Knowledge Graphs</span><span class="rp-tag">SQLite</span><span class="rp-tag">Cyber Threat Intelligence</span><span class="rp-tag">Provenance</span><span class="rp-tag">Graph Similarity</span><span class="rp-tag">Kubernetes Security</span></div>
              <details><summary>Explore the technical and research details</summary><div class="rp-detail">
                <p>The local Python research pipeline preserves source provenance, extracts security-relevant entities and relationships, and represents sourced claims in an evidence-backed graph rather than treating model-generated relationships as automatically true.</p>
                <p>The planned paired evaluation compares <strong>B0</strong>, a profile built only from the earliest reports, with <strong>G1</strong>, a graph-assisted profile that also uses historically eligible structural similarities. Later reporting is held out and used to assess whether the graph-assisted profile surfaced useful characteristics earlier.</p>
                <p>My work includes research design, architecture, provenance and evidence modeling, graph schema design, historical cutoff handling, baseline construction, similarity-analysis infrastructure, source-integrity controls, and evaluation planning. The real-data GraphRAG effectiveness study is still in progress, so the project does not claim completed empirical effectiveness.</p>
              </div></details>
            </article>

            <article class="rp-card">
              <div class="rp-top"><div class="rp-title-row"><div class="rp-icon">⚠</div><div><div class="rp-status">Faculty-Guided Security Research · Ongoing</div><h3 class="rp-name">CTI & LLM Poisoning Research</h3></div></div></div>
              <p class="rp-summary">Research on how poisoned cyber threat intelligence can introduce false relationships into knowledge graphs and then influence retrieval- or LLM-generated security analysis downstream.</p>
              <div class="rp-tags"><span class="rp-tag">LLM Security</span><span class="rp-tag">CTI</span><span class="rp-tag">Knowledge Graph Poisoning</span><span class="rp-tag">Graph Precision / Recall</span><span class="rp-tag">Evidence Verification</span><span class="rp-tag">Contradiction Detection</span><span class="rp-tag">Trustworthy AI</span></div>
              <details><summary>Explore the technical and research details</summary><div class="rp-detail">
                <p>The threat model follows the path from source material to extracted graph relationships and finally to AI-assisted answers. A poisoned assertion such as a false <strong>Threat Actor → USES → Malware</strong> edge can become retrievable context and affect later analysis even when the generated answer sounds plausible.</p>
                <p>My contributions include designing controlled clean and poisoned evaluation conditions, assessing extracted graph relationships with precision and recall, and studying how unsupported or contradictory relationships propagate through the system.</p>
                <p>Defenses under evaluation include evidence verification, contradiction detection, and confidence-weighted relationships so that weakly supported claims exert less influence than independently corroborated evidence.</p>
              </div></details>
            </article>

            <article class="rp-card">
              <div class="rp-top">
                <div class="rp-title-row"><div class="rp-icon">P</div><div><div class="rp-status">CSC 4900 Advanced Software Project · Prototype</div><h3 class="rp-name">UniParkingBuddy</h3></div></div>
                <div class="rp-links"><a class="rp-link" href="https://github.com/FardinSamin/UniParkingBuddy" target="_blank" rel="noreferrer">GitHub ↗</a></div>
              </div>
              <p class="rp-summary">A computer-vision campus parking prototype that classifies manually configured parking spaces as AVAILABLE or OCCUPIED from authorized prerecorded footage or an approved portable camera setup.</p>
              <div class="rp-tags"><span class="rp-tag">Python</span><span class="rp-tag">YOLO</span><span class="rp-tag">OpenCV</span><span class="rp-tag">FastAPI</span><span class="rp-tag">PostgreSQL</span><span class="rp-tag">React</span><span class="rp-tag">TypeScript</span><span class="rp-tag">Computer Vision</span></div>
              <details><summary>Explore the technical and engineering details</summary><div class="rp-detail">
                <p>YOLO and OpenCV process parking footage and associate detected vehicles with configured parking-space polygons. FastAPI exposes the current monitored-lot state to a read-only React + TypeScript interface, while PostgreSQL can store anonymous timestamped observations for descriptive history.</p>
                <p>The baseline deliberately avoids identity tracking: it does not identify people, license plates, or specific vehicles, and it does not reserve spaces, process payments, or enforce parking rules. Replayed demonstration video is not presented as current campus traffic.</p>
                <p>My work includes architecture, requirements and design documentation, backend/database integration, computer-vision workflow development, parking-space calibration, API contracts, testing, validation planning, and integration. Separate experimental work explores camera-adaptive stall discovery without silently replacing the manually configured baseline.</p>
              </div></details>
            </article>
          </div>

          <div class="rp-subhead"><p class="font-mono text-primary text-sm tracking-[0.2em] uppercase mb-2">// selected projects</p><h3>Additional Builds</h3></div>
          <div class="rp-small-grid">
            <article class="rp-small"><div class="rp-status">Local AI · Application Security</div><h4 class="rp-small-title">Secure Local AI Assistant</h4><p>A locally hosted AI assistant using React/TypeScript, Node.js/Express, and Ollama. The project emphasizes keeping model interaction local where possible while incorporating authentication and application-level safeguards around the assistant and backend.</p><div class="rp-tags"><span class="rp-tag">React</span><span class="rp-tag">TypeScript</span><span class="rp-tag">Node.js</span><span class="rp-tag">Express</span><span class="rp-tag">Ollama</span><span class="rp-tag">Authentication</span></div></article>
            <article class="rp-small"><div class="rp-status">Full-Stack · Data Visualization</div><h4 class="rp-small-title">AcademicPlanner</h4><p>A React, FastAPI, SQLite, and D3 academic-planning application. My contributions focused on application architecture, database schema design, testing, and coordinating the data model across the frontend and backend.</p><div class="rp-tags"><span class="rp-tag">React</span><span class="rp-tag">FastAPI</span><span class="rp-tag">SQLite</span><span class="rp-tag">D3</span><span class="rp-tag">REST APIs</span><span class="rp-tag">Testing</span></div></article>
            <article class="rp-small"><div class="rp-status">HackUNCP · Incident Response</div><h4 class="rp-small-title">TriageTap</h4><p>An AI-assisted incident-response prototype built during HackUNCP with Java, Spring Boot, and MongoDB. The project explored how an application can organize early incident information and support faster triage decisions under hackathon time constraints.</p><div class="rp-tags"><span class="rp-tag">Java</span><span class="rp-tag">Spring Boot</span><span class="rp-tag">MongoDB</span><span class="rp-tag">Incident Response</span><span class="rp-tag">AI Workflows</span></div></article>
            <article class="rp-small"><div class="rp-status">Kubernetes Security · Retrieval Research</div><h4 class="rp-small-title">KubeSecKB</h4><p>A Kubernetes security knowledge and retrieval project combining CIS guidance, Falco detections, and vulnerability information. The work focuses on corpus construction, ground-truth retrieval evaluation, and robustness against manipulated or poisoned security knowledge.</p><div class="rp-tags"><span class="rp-tag">Kubernetes Security</span><span class="rp-tag">CIS</span><span class="rp-tag">Falco</span><span class="rp-tag">CVEs</span><span class="rp-tag">RAG</span><span class="rp-tag">Retrieval Evaluation</span></div></article>
          </div>
        </div>`;

      const ensureProjectsSection = () => {
        if (!document.getElementById("projects")) {
          const about = document.getElementById("about");
          const education = document.getElementById("education");
          if (!about || !education) return;
          const section = document.createElement("section");
          section.id = "projects";
          section.className = "relative py-32 px-6";
          section.innerHTML = sectionMarkup;
          about.insertAdjacentElement("afterend", section);
        }

        document.querySelectorAll('a[href="#education"]').forEach((educationLink) => {
          const parent = educationLink.parentElement;
          if (!parent || parent.querySelector('a[href="#projects"]')) return;
          const link = document.createElement("a");
          link.href = "#projects";
          link.textContent = "Projects";
          link.className = educationLink.className;
          link.addEventListener("click", (event) => {
            event.preventDefault();
            document.getElementById("projects")?.scrollIntoView({ behavior: "smooth" });
          });
          parent.insertBefore(link, educationLink);
        });
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", ensureProjectsSection);
      } else {
        ensureProjectsSection();
      }
      const observer = new MutationObserver(ensureProjectsSection);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      setTimeout(() => observer.disconnect(), 15000);
    })();
  </script>

  <script data-safe-direction-copy>
    (() => {
      const applyDirectionCopy = () => {
        if (document.documentElement.hasAttribute("data-direction-copy-applied")) return true;

        const projects = document.getElementById("projects");
        const headings = Array.from(document.querySelectorAll("h1,h2,h3,h4"));

        const directionHeading = headings.find((el) => {
          const text = (el.textContent || "").trim();
          return text === "What I'm Building" && (!projects || !projects.contains(el));
        });

        if (!directionHeading) return false;

        directionHeading.textContent = "Where I'm Headed";

        const headingContainer = directionHeading.parentElement;
        if (headingContainer) {
          const kicker = Array.from(headingContainer.querySelectorAll("p")).find((el) =>
            (el.textContent || "").trim().toLowerCase().includes("featured")
          );
          if (kicker) kicker.textContent = "// DIRECTION";
        }

        const section =
          directionHeading.closest("section") ||
          directionHeading.parentElement?.parentElement?.parentElement;

        if (!section) return false;

        const elements = Array.from(section.querySelectorAll("h2,h3,h4,p"));

        const mainHeading = elements.find((el) =>
          (el.textContent || "").trim().startsWith("A builder at the intersection")
        );
        if (mainHeading) {
          mainHeading.textContent =
            "Building across research, intelligent systems, and real-world software";
        }

        const mainBody = elements.find((el) => {
          const text = (el.textContent || "").trim();
          return text.startsWith("I’m building a path") || text.startsWith("I'm building a path");
        });
        if (mainBody) {
          mainBody.textContent =
            "I like working on problems that sit between research and engineering—where an idea has to become something that can actually be designed, built, tested, and evaluated. My work spans cybersecurity, trustworthy AI, knowledge graphs, computer vision, and full-stack software systems. Some projects begin with a research question; others begin with a practical problem. What interests me most is understanding how the pieces fit together and building systems that are useful, explainable, and technically sound.";
        }

        const updateCard = (title, copy) => {
          const titleEl = elements.find(
            (el) => (el.textContent || "").trim() === title
          );
          if (!titleEl) return;
          const card = titleEl.parentElement;
          if (!card) return;
          const body = Array.from(card.querySelectorAll("p")).find(
            (el) => (el.textContent || "").trim().length > 0
          );
          if (body) body.textContent = copy;
        };

        updateCard(
          "Current Focus",
          "Right now, I’m balancing research with hands-on software development. I’m developing ThreatRAGraph around GraphRAG and evidence-backed knowledge graphs, working on UniParkingBuddy across computer vision and full-stack engineering, and continuing to explore local AI, retrieval, secure software design, and applied machine learning."
        );

        updateCard(
          "What Sets Me Apart",
          "I enjoy moving between different layers of a problem. I can start with a research question, think through how it should be measured, design the system behind it, and then work through the implementation details needed to make it real. I care about whether something works, but also how we know it works, what assumptions it depends on, and where it might fail."
        );

        document.documentElement.setAttribute("data-direction-copy-applied", "");
        return true;
      };

      const attempt = () => {
        if (applyDirectionCopy()) return;
        setTimeout(() => {
          if (applyDirectionCopy()) return;
          setTimeout(applyDirectionCopy, 750);
        }, 200);
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", attempt, { once: true });
      } else {
        attempt();
      }
    })();
  </script>

  <script data-safe-academic-copy>
    (() => {
      const applyAcademicCopy = () => {
        if (document.documentElement.hasAttribute("data-academic-copy-applied")) return true;

        const section = document.getElementById("education");
        if (!section) return false;

        const all = Array.from(section.querySelectorAll("h1,h2,h3,h4,p,span"));

        const setExact = (oldText, newText) => {
          const el = all.find((node) => (node.textContent || "").trim() === oldText);
          if (el) el.textContent = newText;
          return el;
        };

        setExact("Expected Graduation: Spring 2027", "Expected Graduation: May 2027");
        setExact(
          "Maynor Honors College · ACM President · Resident Advisor · Orientation Leader",
          "Maynor Honors College · Chancellor’s List · ACM Student Chapter President · Lead Resident Advisor"
        );
        setExact(
          "Cybersecurity, Cloud Security, Data Structures, Web Development, Software Engineering, Networking, and Java Programming",
          "Data Structures · Software Development · Operating Systems · Network Architecture · Programming Languages · Cloud Security · Network Security · Advanced Software Project"
        );
        setExact(
          "Focused on cybersecurity, secure systems, technical growth, and building a strong long-term foundation in computing.",
          "I’m most interested in coursework that connects computer science theory with real systems—from software architecture and data structures to operating systems, networks, security, and intelligent systems."
        );

        const directionHeading = setExact("Current Direction", "Academic Priorities");
        setExact(
          "Combining academics, leadership, and practical project work while preparing for future opportunities in cybersecurity and advanced study.",
          "I’m continuing to strengthen my foundations in systems, networking, software engineering, security, data, and applied AI while becoming better at technical problem-solving, experimentation, documentation, and communicating complex ideas clearly."
        );

        const graduationText = Array.from(section.querySelectorAll("span,p")).find((el) =>
          (el.textContent || "").trim() === "Expected Graduation: May 2027"
        );

        if (graduationText && !section.querySelector("[data-education-gpa]")) {
          const gpa = document.createElement("span");
          gpa.setAttribute("data-education-gpa", "");
          gpa.textContent = "GPA: 3.70 / 4.00";
          gpa.style.cssText = "display:inline-block;margin-left:1rem;font-size:.875rem;font-weight:600;color:hsl(var(--foreground) / .8)";
          graduationText.insertAdjacentElement("afterend", gpa);
        }

        if (!directionHeading) return false;

        document.documentElement.setAttribute("data-academic-copy-applied", "");
        return true;
      };

      const attempt = (remaining = 8) => {
        if (applyAcademicCopy() || remaining <= 0) return;
        setTimeout(() => attempt(remaining - 1), 250);
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => attempt(), { once: true });
      } else {
        attempt();
      }
    })();
  </script>

  <script data-safe-milestones-copy>
    (() => {
      const applyMilestonesCopy = () => {
        if (document.documentElement.hasAttribute("data-milestones-copy-applied")) return true;

        const education = document.getElementById("education");
        const achievements = document.getElementById("achievements");
        if (!education || !achievements) return false;

        const setExactWithin = (root, oldText, newText) => {
          const nodes = Array.from(root.querySelectorAll("h1,h2,h3,h4,p,span"));
          const el = nodes.find((node) => (node.textContent || "").trim() === oldText);
          if (el) el.textContent = newText;
          return el;
        };

        setExactWithin(education, "Honors & Leadership", "Honors & Recognition");

        const educationNodes = Array.from(education.querySelectorAll("p,span"));
        const honorsText = educationNodes.find((el) => {
          const text = (el.textContent || "").trim();
          return text.includes("Maynor Honors College") &&
            (text.includes("ACM") || text.includes("Lead Resident Advisor"));
        });
        if (honorsText) {
          honorsText.textContent = "Maynor Honors College · Chancellor’s List";
        }

        const updateMilestoneCard = (oldTitle, newTitle, newCopy) => {
          const headings = Array.from(achievements.querySelectorAll("h2,h3,h4"));
          const titleEl = headings.find((el) => (el.textContent || "").trim() === oldTitle);
          if (!titleEl) return false;

          titleEl.textContent = newTitle;
          const card = titleEl.closest("div[class*='card'], article") || titleEl.parentElement?.parentElement?.parentElement;
          if (!card) return true;

          const body = Array.from(card.querySelectorAll("p")).find((el) => {
            const text = (el.textContent || "").trim();
            return text.length > 30 && !text.startsWith("//");
          });
          if (body) body.textContent = newCopy;
          return true;
        };

        updateMilestoneCard(
          "Leadership in Action",
          "ACM Student Chapter President",
          "Leading the ACM Student Chapter at UNC Pembroke, organizing technical engagement, student programming, and community-building initiatives."
        );

        updateMilestoneCard(
          "Campus Leadership",
          "Lead Resident Advisor",
          "Promoted from Resident Advisor to Lead Resident Advisor, taking on broader peer leadership, resident support, and community responsibilities."
        );

        updateMilestoneCard(

  <script data-safe-cta-copy>
    (() => {
      const applyCta = () => {
        if (document.documentElement.hasAttribute("data-cta-v2-applied")) return true;

        const headings = Array.from(document.querySelectorAll("h1,h2,h3,h4"));
        const heading = headings.find((el) => {
          const text = (el.textContent || "").trim();
          return text === "Let’s Build Something Great" ||
                 text === "Let's Build Something Great" ||
                 text === "Have an Idea Worth Exploring?";
        });

        if (!heading) return false;

        const container =
          heading.closest("section") ||
          heading.closest("div[class*='glass']") ||
          heading.parentElement?.parentElement;

        if (!container) return false;

        heading.textContent = "Have an Idea Worth Exploring?";

        const paragraphs = Array.from(container.querySelectorAll("p"));
        const kicker = paragraphs.find((el) => {
          const text = (el.textContent || "").trim().toLowerCase();
          return text.includes("next step") || text.includes("what's next");
        });
        if (kicker) kicker.textContent = "// WHAT'S NEXT";

        let body = paragraphs.find((el) => {
          const text = (el.textContent || "").trim();
          return text.startsWith("This is your final call-to-action area") ||
                 text.startsWith("Whether it starts as a research question");
        });

        if (body) {
          body.textContent =
            "Whether it starts as a research question, a technical challenge, or an opportunity to collaborate, I’m always interested in conversations that could lead somewhere meaningful.";
        }

        const oldLabels = new Set([
          "Explore More",
          "Projects",
          "View Journey",
          "Get in Touch",
          "GitHub",
          "LinkedIn"
        ]);

        const oldActions = Array.from(container.querySelectorAll("a,button"))
          .filter((el) => oldLabels.has((el.textContent || "").trim()));

        const oldParents = new Set(oldActions.map((el) => el.parentElement).filter(Boolean));
        oldActions.forEach((el) => el.remove());

        oldParents.forEach((parent) => {
          if (parent && parent.children.length === 0) parent.remove();
        });

        const existingRow = container.querySelector("[data-cta-actions]");
        if (existingRow) existingRow.remove();

        const row = document.createElement("div");
        row.setAttribute("data-cta-actions", "");
        row.style.cssText =
          "margin-top:2rem;display:flex;flex-wrap:wrap;justify-content:center;gap:1rem";

        const makeLink = (label, href, primary = false) => {
          const link = document.createElement("a");
          link.textContent = label;
          link.href = href;
          link.style.cssText = primary
            ? "display:inline-flex;align-items:center;justify-content:center;min-width:140px;padding:.8rem 1.4rem;border-radius:.65rem;background:hsl(var(--primary));color:hsl(var(--primary-foreground));font-weight:700;text-decoration:none"

          if (href.startsWith("http")) {
            link.target = "_blank";
            link.rel = "noreferrer";
          }
          return link;
        };

        row.appendChild(
          makeLink("Get in Touch", "mailto:fes006@bravemail.uncp.edu", true)
        );
        row.appendChild(
          makeLink("GitHub", "https://github.com/FardinSamin")
        );
        row.appendChild(
          makeLink("LinkedIn", "https://www.linkedin.com/in/fardin-samin")
        );

        const bodyParent = body?.parentElement;
        if (bodyParent) {
          body.insertAdjacentElement("afterend", row);
        } else {
          container.appendChild(row);
        }

        document.documentElement.setAttribute("data-cta-v2-applied", "");
        return true;
      };

      const attempt = (remaining = 12) => {
        if (applyCta() || remaining <= 0) return;
        setTimeout(() => attempt(remaining - 1), 250);
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => attempt(), { once: true });
      } else {
        attempt();
      }
    })();
  </script>

      if (!target) return;

      const label = (target.textContent || "").trim();
      if (label !== "Resume" && label !== "Download Resume") return;

      event.preventDefault();
      event.stopImmediatePropagation();

      const link = document.createElement("a");
      link.href = "/resume.pdf";
      link.download = "Fardin_Samin_Resume.pdf";
      document.body.appendChild(link);
      link.click();
      link.remove();
